version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_fukamu_cycle_baseline.up.sql"
      - "migrations/000002_ai_usage_retention_margin.up.sql"
      - "migrations/000003_ai_usage_settlement_exposure.up.sql"
      - "migrations/000004_ai_generation_hash_split.up.sql"
      - "migrations/000005_retention_cleanup_index.up.sql"
    queries: "internal/infrastructure/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/infrastructure/postgres/generated"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_result_struct_pointers: true
