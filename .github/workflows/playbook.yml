name: Playbook policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          install: false
      - name: Validate vendored playbook and Cycle ownership trace
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
          PYTHONSAFEPATH: "1"
        run: |
          node scripts/validate-playbook-config.mjs .
          python3 .fukamu/playbook/validate.py --consumer .
