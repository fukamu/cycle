name: Deploy Staging

on:
  workflow_run:
    workflows: [Terraform Apply Staging]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'Terraform Apply Staging' &&
       github.event.workflow_run.path == '.github/workflows/terraform-apply.yml' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.status == 'completed' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Resolve deployment commit
        id: resolve
        shell: bash
        env:
          APPLY_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
              echo '::error::Manual Staging deployment is allowed only from main.'
              exit 1
            fi
            commit_sha="${GITHUB_SHA}"
          else
            if [[ ! "${APPLY_RUN_ID}" =~ ^[0-9]+$ ]]; then
              echo "::error::Terraform Apply workflow run ID must be numeric: ${APPLY_RUN_ID}"
              exit 1
            fi
            artifacts_json="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${APPLY_RUN_ID}/artifacts?per_page=100"
            )"
            artifact_name="$(
              jq -ser \
                --arg run_id "${APPLY_RUN_ID}" \
                --arg prefix "terraform-apply-staging-" \
                '
                  if (
                    length == 1 and
                    (.[0] | type) == "object" and
                    (.[0].total_count | type) == "number" and
                    (.[0].total_count | floor) == .[0].total_count and
                    .[0].total_count >= 0 and
                    (.[0].artifacts | type) == "array" and
                    .[0].total_count == (.[0].artifacts | length) and
                    .[0].total_count <= 100 and
                    all(.[0].artifacts[];
                      (type == "object") and
                      (.id | type) == "number" and
                      (.id | floor) == .id and
                      .id > 0 and
                      (.name | type) == "string" and
                      (.expired | type) == "boolean" and
                      (.workflow_run | type) == "object" and
                      (.workflow_run.id | type) == "number" and
                      (.workflow_run.id | floor) == .workflow_run.id and
                      (.workflow_run.id | tostring) == $run_id
                    )
                  ) then
                    [
                      .[0].artifacts[]
                      | select(
                          .expired == false and
                          (.name | startswith($prefix))
                        )
                    ] as $matches
                    | if ($matches | length) == 1 then
                        $matches[0].name
                      else
                        error("expected exactly one deployment metadata artifact")
                      end
                  else
                    error("invalid or paginated artifact response")
                  end
                ' \
                <<< "${artifacts_json}"
            )"
            commit_sha="${artifact_name#terraform-apply-staging-}"
          fi

          if [[ ! "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved deployment commit is not a valid SHA: ${commit_sha}"
            exit 1
          fi
          current_main_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ "${commit_sha}" != "${current_main_sha}" ]]; then
            echo "::error::Deployment commit ${commit_sha} is stale; current main is ${current_main_sha}."
            exit 1
          fi
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://cycle.staging.fukamu.matoruru.com
    env:
      COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      BETA_ADMISSION_MODE: ${{ vars.BETA_ADMISSION_MODE || 'off' }}
      BETA_ADMISSION_COOKIE_TTL_DAYS: ${{ vars.BETA_ADMISSION_COOKIE_TTL_DAYS }}
      BETA_INVITES: ${{ vars.BETA_INVITES }}
      APP_REFERRAL_URL: ${{ vars.APP_REFERRAL_URL }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      DB_MAX_OPEN_CONNS: ${{ vars.DB_MAX_OPEN_CONNS }}
      DB_MAX_IDLE_CONNS: ${{ vars.DB_MAX_IDLE_CONNS }}
      DB_CONN_MAX_LIFETIME_MINUTES: ${{ vars.DB_CONN_MAX_LIFETIME_MINUTES }}
      SESSION_IDLE_DAYS: ${{ vars.SESSION_IDLE_DAYS }}
      SESSION_ABSOLUTE_DAYS: ${{ vars.SESSION_ABSOLUTE_DAYS }}
      SESSION_ACTIVITY_TOUCH_MINUTES: ${{ vars.SESSION_ACTIVITY_TOUCH_MINUTES }}
      ANONYMOUS_BOOTSTRAP_TTL_MINUTES: ${{ vars.ANONYMOUS_BOOTSTRAP_TTL_MINUTES }}
      MAX_PROGRESSING_GOALS: ${{ vars.MAX_PROGRESSING_GOALS }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT }}
      AI_MAX_INPUT_TOKENS: ${{ vars.AI_MAX_INPUT_TOKENS }}
      AI_GOAL_REFINE_MAX_OUTPUT_TOKENS: ${{ vars.AI_GOAL_REFINE_MAX_OUTPUT_TOKENS }}
      AI_ACTION_MAX_OUTPUT_TOKENS: ${{ vars.AI_ACTION_MAX_OUTPUT_TOKENS }}
      AI_MAX_CONTEXT_CYCLES: ${{ vars.AI_MAX_CONTEXT_CYCLES }}
      AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS }}
      AI_MAX_PROVIDER_ATTEMPTS: ${{ vars.AI_MAX_PROVIDER_ATTEMPTS }}
      AI_MAX_RETRY_BACKOFF_SECONDS: ${{ vars.AI_MAX_RETRY_BACKOFF_SECONDS }}
      AI_FINALIZATION_GRACE_SECONDS: ${{ vars.AI_FINALIZATION_GRACE_SECONDS }}
      AI_LEASE_SECONDS: ${{ vars.AI_LEASE_SECONDS }}
      AI_MAX_GENERATIONS_PER_USER_24H: ${{ vars.AI_MAX_GENERATIONS_PER_USER_24H }}
      AI_GOAL_REFINE_PROMPT_VERSION: ${{ vars.AI_GOAL_REFINE_PROMPT_VERSION }}
      AI_GENERATE_PROMPT_VERSION: ${{ vars.AI_GENERATE_PROMPT_VERSION }}
      AI_REFINE_PROMPT_VERSION: ${{ vars.AI_REFINE_PROMPT_VERSION }}
      AI_TOKENIZER_ENCODING: ${{ vars.AI_TOKENIZER_ENCODING }}
      AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}
      AI_WARNING_THRESHOLDS: ${{ vars.AI_WARNING_THRESHOLDS }}
      AI_PRICE_INPUT_USD_PER_MILLION: ${{ vars.AI_PRICE_INPUT_USD_PER_MILLION }}
      AI_PRICE_OUTPUT_USD_PER_MILLION: ${{ vars.AI_PRICE_OUTPUT_USD_PER_MILLION }}
      RATE_ANONYMOUS_CREATE_PER_IP_HOUR: ${{ vars.RATE_ANONYMOUS_CREATE_PER_IP_HOUR }}
      RATE_ANONYMOUS_CREATE_PER_IP_24H: ${{ vars.RATE_ANONYMOUS_CREATE_PER_IP_24H }}
      RATE_GOAL_START_PER_USER_MINUTE: ${{ vars.RATE_GOAL_START_PER_USER_MINUTE }}
      RATE_GOAL_START_PER_SESSION_MINUTE: ${{ vars.RATE_GOAL_START_PER_SESSION_MINUTE }}
      RATE_AI_PER_USER_MINUTE: ${{ vars.RATE_AI_PER_USER_MINUTE }}
      RATE_AI_PER_SESSION_MINUTE: ${{ vars.RATE_AI_PER_SESSION_MINUTE }}
      RATE_AI_PER_IP_MINUTE: ${{ vars.RATE_AI_PER_IP_MINUTE }}
    steps:
      - name: Verify commit has successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_runs="$(
            gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${COMMIT_SHA}" \
              -f branch=main \
              -f event=push \
              -f status=completed \
              -f per_page=100 \
              | jq -er \
                --arg commit_sha "${COMMIT_SHA}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                '
                  . as $root
                  | if (
                      ($root | type) == "object" and
                      ($root.total_count | type) == "number" and
                      $root.total_count >= 0 and
                      ($root.workflow_runs | type) == "array" and
                      $root.total_count == ($root.workflow_runs | length) and
                      $root.total_count <= 100 and
                      all($root.workflow_runs[];
                        (type == "object") and
                        (.name | type) == "string" and
                        (.path | type) == "string" and
                        (.event | type) == "string" and
                        (.status | type) == "string" and
                        (.conclusion | type) == "string" and
                        (.head_sha | type) == "string" and
                        (.head_branch | type) == "string" and
                        (.head_repository | type) == "object" and
                        (.head_repository.full_name | type) == "string"
                      )
                    ) then
                      [
                        $root.workflow_runs[]
                        | select(
                            .name == "CI" and
                            .path == ".github/workflows/ci.yml" and
                            .event == "push" and
                            .status == "completed" and
                            .conclusion == "success" and
                            .head_sha == $commit_sha and
                            .head_branch == "main" and
                            .head_repository.full_name == $repository
                          )
                      ]
                      | length
                    else
                      error("invalid CI workflow-run response")
                    end
                '
          )"
          if [[ ! "${successful_runs}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No exact successful main push CI run found for commit ${COMMIT_SHA}."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum

      - name: Validate required deployment inputs
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          SESSION_TOKEN_PEPPER: ${{ secrets.SESSION_TOKEN_PEPPER }}
          CSRF_TOKEN_PEPPER: ${{ secrets.CSRF_TOKEN_PEPPER }}
          BOOTSTRAP_ID_PEPPER: ${{ secrets.BOOTSTRAP_ID_PEPPER }}
          RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
          CURSOR_SIGNING_SECRET: ${{ secrets.CURSOR_SIGNING_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          BETA_ADMISSION_COOKIE_KEY: ${{ secrets.BETA_ADMISSION_COOKIE_KEY }}
        run: node ./scripts/validate-deploy-inputs.mjs

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dependency install preserved candidate tree
        run: |
          set -euo pipefail
          git diff --quiet --
          git diff --cached --quiet --
          untracked_files="$(git ls-files --others --exclude-standard)"
          [[ -z "${untracked_files}" ]]

      - name: Install staging Chromium
        run: pnpm --filter fukamu-cycle-frontend --fail-if-no-match exec playwright install --with-deps chromium

      - name: Build static frontend
        env:
          VITE_DEPLOYMENT_ENV: staging
          VITE_APP_REFERRAL_URL: ${{ env.APP_REFERRAL_URL }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ env.GOOGLE_WEB_CLIENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ env.TURNSTILE_SITE_KEY }}
        run: pnpm --filter fukamu-cycle-frontend --fail-if-no-match run build

      - name: Validate Backend runtime configuration
        shell: bash
        working-directory: backend
        env:
          APP_ENV: production
          HTTP_ADDRESS: :8080
          STATIC_DIR: ""
          AI_PROVIDER: openai
          AI_PRICING_MODEL: ${{ env.AI_MODEL }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          SESSION_TOKEN_PEPPER: ${{ secrets.SESSION_TOKEN_PEPPER }}
          CSRF_TOKEN_PEPPER: ${{ secrets.CSRF_TOKEN_PEPPER }}
          BOOTSTRAP_ID_PEPPER: ${{ secrets.BOOTSTRAP_ID_PEPPER }}
          RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
          CURSOR_SIGNING_SECRET: ${{ secrets.CURSOR_SIGNING_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_ENABLED: "true"
          TURNSTILE_EXPECTED_ACTION: anonymous_bootstrap
        run: GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly go run ./cmd/configcheck

      - name: Re-verify deployment commit is still main HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Current main ref did not resolve to a valid commit SHA: ${current_main_sha}"
            exit 1
          fi
          if [[ "${COMMIT_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Deployment commit ${COMMIT_SHA} became stale before migration; current main is ${current_main_sha}."
            exit 1
          fi

      - name: Apply database migrations
        shell: bash
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          MIGRATIONS_DIR: migrations
        run: GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly go run ./cmd/migrate

      - name: Re-verify deployment commit after migrations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Current main ref did not resolve to a valid commit SHA: ${current_main_sha}"
            exit 1
          fi
          if [[ "${COMMIT_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Deployment commit ${COMMIT_SHA} became stale after migration; refusing secret materialization and traffic switch. Current main is ${current_main_sha}."
            exit 1
          fi

      - name: Create ephemeral Worker secrets file
        shell: bash
        env:
          SECRETS_FILE: ${{ runner.temp }}/fukamu-cycle-worker-secrets.json
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          SESSION_TOKEN_PEPPER: ${{ secrets.SESSION_TOKEN_PEPPER }}
          CSRF_TOKEN_PEPPER: ${{ secrets.CSRF_TOKEN_PEPPER }}
          BOOTSTRAP_ID_PEPPER: ${{ secrets.BOOTSTRAP_ID_PEPPER }}
          RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
          CURSOR_SIGNING_SECRET: ${{ secrets.CURSOR_SIGNING_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BETA_ADMISSION_COOKIE_KEY: ${{ secrets.BETA_ADMISSION_COOKIE_KEY }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const names = [
            "DATABASE_URL", "OTEL_EXPORTER_OTLP_HEADERS", "SESSION_TOKEN_PEPPER", "CSRF_TOKEN_PEPPER",
            "BOOTSTRAP_ID_PEPPER", "RATE_LIMIT_HMAC_SECRET", "CURSOR_SIGNING_SECRET", "OPENAI_API_KEY", "TURNSTILE_SECRET_KEY",
          ];
          if (process.env.BETA_ADMISSION_COOKIE_KEY) names.push("BETA_ADMISSION_COOKIE_KEY");
          const values = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(values), { mode: 0o600 });
          NODE

      - name: Deploy Worker, static assets, and Container
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          variable_names=(
            PUBLIC_ORIGIN OTEL_EXPORTER_OTLP_ENDPOINT BETA_ADMISSION_MODE DB_MAX_OPEN_CONNS
            DB_MAX_IDLE_CONNS DB_CONN_MAX_LIFETIME_MINUTES
            SESSION_IDLE_DAYS SESSION_ABSOLUTE_DAYS SESSION_ACTIVITY_TOUCH_MINUTES
            ANONYMOUS_BOOTSTRAP_TTL_MINUTES MAX_PROGRESSING_GOALS AI_MODEL AI_REASONING_EFFORT
            AI_MAX_INPUT_TOKENS
            AI_GOAL_REFINE_MAX_OUTPUT_TOKENS AI_ACTION_MAX_OUTPUT_TOKENS AI_MAX_CONTEXT_CYCLES
            AI_TIMEOUT_SECONDS AI_MAX_PROVIDER_ATTEMPTS AI_MAX_RETRY_BACKOFF_SECONDS
            AI_FINALIZATION_GRACE_SECONDS AI_LEASE_SECONDS AI_MAX_GENERATIONS_PER_USER_24H
            AI_GOAL_REFINE_PROMPT_VERSION AI_GENERATE_PROMPT_VERSION AI_REFINE_PROMPT_VERSION
            AI_TOKENIZER_ENCODING AI_MONTHLY_BUDGET_USD AI_WARNING_THRESHOLDS
            AI_PRICE_INPUT_USD_PER_MILLION AI_PRICE_OUTPUT_USD_PER_MILLION GOOGLE_WEB_CLIENT_ID
            RATE_ANONYMOUS_CREATE_PER_IP_HOUR RATE_ANONYMOUS_CREATE_PER_IP_24H
            RATE_GOAL_START_PER_USER_MINUTE RATE_GOAL_START_PER_SESSION_MINUTE
            RATE_AI_PER_USER_MINUTE RATE_AI_PER_SESSION_MINUTE RATE_AI_PER_IP_MINUTE
          )
          variable_args=()
          for name in "${variable_names[@]}"; do
            variable_args+=(--var "${name}:${!name}")
          done
          if [[ "${BETA_ADMISSION_MODE}" == 'closed' ]]; then
            variable_args+=(
              --var "BETA_ADMISSION_COOKIE_TTL_DAYS:${BETA_ADMISSION_COOKIE_TTL_DAYS}"
              --var "BETA_INVITES:${BETA_INVITES}"
            )
          fi
          variable_args+=(--var "AI_PRICING_MODEL:${AI_MODEL}")
          pnpm --filter fukamu-cycle-cloudflare --fail-if-no-match exec wrangler deploy \
            "${variable_args[@]}" \
            --secrets-file "${RUNNER_TEMP}/fukamu-cycle-worker-secrets.json" \
            --containers-rollout=immediate

      - name: Remove ephemeral Worker secrets file
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/fukamu-cycle-worker-secrets.json"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 10 --max-time 30 "${PUBLIC_ORIGIN}/healthz"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 30 "${PUBLIC_ORIGIN}/readyz"

      - name: Run staging critical journey
        shell: bash
        env:
          STAGING_BASE_URL: ${{ env.PUBLIC_ORIGIN }}
          STAGING_E2E_INVITE_TOKEN: ${{ secrets.STAGING_E2E_INVITE_TOKEN }}
        run: bash ./scripts/check-staging-critical.sh
