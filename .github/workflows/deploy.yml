name: Deploy Staging

on:
  workflow_run:
    workflows: [Terraform Apply Staging]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Resolve deployment commit
        id: resolve
        shell: bash
        env:
          APPLY_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
              echo '::error::Manual Staging deployment is allowed only from main.'
              exit 1
            fi
            commit_sha="${GITHUB_SHA}"
          else
            artifacts_json="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${APPLY_RUN_ID}/artifacts?per_page=100"
            )"
            mapfile -t artifact_names < <(
              jq -r \
                '.artifacts[]
                 | select(.expired == false)
                 | .name
                 | select(startswith("terraform-apply-staging-"))' \
                <<< "${artifacts_json}"
            )
            if [[ "${#artifact_names[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one Terraform Apply deployment metadata artifact in run ${APPLY_RUN_ID}."
              exit 1
            fi
            commit_sha="${artifact_names[0]#terraform-apply-staging-}"
          fi

          if [[ ! "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved deployment commit is not a valid SHA: ${commit_sha}"
            exit 1
          fi
          current_main_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ "${commit_sha}" != "${current_main_sha}" ]]; then
            echo "::error::Deployment commit ${commit_sha} is stale; current main is ${current_main_sha}."
            exit 1
          fi
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://cycle.staging.fukamu.matoruru.com
    env:
      COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      BETA_ADMISSION_MODE: ${{ vars.BETA_ADMISSION_MODE || 'off' }}
      BETA_ADMISSION_COOKIE_TTL_DAYS: ${{ vars.BETA_ADMISSION_COOKIE_TTL_DAYS }}
      BETA_INVITES: ${{ vars.BETA_INVITES }}
      APP_REFERRAL_URL: ${{ vars.APP_REFERRAL_URL }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      DB_MAX_OPEN_CONNS: ${{ vars.DB_MAX_OPEN_CONNS }}
      DB_MAX_IDLE_CONNS: ${{ vars.DB_MAX_IDLE_CONNS }}
      DB_CONN_MAX_LIFETIME_MINUTES: ${{ vars.DB_CONN_MAX_LIFETIME_MINUTES }}
      SESSION_IDLE_DAYS: ${{ vars.SESSION_IDLE_DAYS }}
      SESSION_ABSOLUTE_DAYS: ${{ vars.SESSION_ABSOLUTE_DAYS }}
      SESSION_ACTIVITY_TOUCH_MINUTES: ${{ vars.SESSION_ACTIVITY_TOUCH_MINUTES }}
      ANONYMOUS_BOOTSTRAP_TTL_MINUTES: ${{ vars.ANONYMOUS_BOOTSTRAP_TTL_MINUTES }}
      MAX_PROGRESSING_GOALS: ${{ vars.MAX_PROGRESSING_GOALS }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_MAX_INPUT_TOKENS: ${{ vars.AI_MAX_INPUT_TOKENS }}
      AI_GOAL_REFINE_MAX_OUTPUT_TOKENS: ${{ vars.AI_GOAL_REFINE_MAX_OUTPUT_TOKENS }}
      AI_ACTION_MAX_OUTPUT_TOKENS: ${{ vars.AI_ACTION_MAX_OUTPUT_TOKENS }}
      AI_MAX_CONTEXT_CYCLES: ${{ vars.AI_MAX_CONTEXT_CYCLES }}
      AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS }}
      AI_MAX_PROVIDER_ATTEMPTS: ${{ vars.AI_MAX_PROVIDER_ATTEMPTS }}
      AI_MAX_RETRY_BACKOFF_SECONDS: ${{ vars.AI_MAX_RETRY_BACKOFF_SECONDS }}
      AI_FINALIZATION_GRACE_SECONDS: ${{ vars.AI_FINALIZATION_GRACE_SECONDS }}
      AI_LEASE_SECONDS: ${{ vars.AI_LEASE_SECONDS }}
      AI_MAX_GENERATIONS_PER_USER_24H: ${{ vars.AI_MAX_GENERATIONS_PER_USER_24H }}
      AI_GOAL_REFINE_PROMPT_VERSION: ${{ vars.AI_GOAL_REFINE_PROMPT_VERSION }}
      AI_GENERATE_PROMPT_VERSION: ${{ vars.AI_GENERATE_PROMPT_VERSION }}
      AI_REFINE_PROMPT_VERSION: ${{ vars.AI_REFINE_PROMPT_VERSION }}
      AI_TOKENIZER_ENCODING: ${{ vars.AI_TOKENIZER_ENCODING }}
      AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}
      AI_WARNING_THRESHOLDS: ${{ vars.AI_WARNING_THRESHOLDS }}
      AI_PRICE_INPUT_USD_PER_MILLION: ${{ vars.AI_PRICE_INPUT_USD_PER_MILLION }}
      AI_PRICE_OUTPUT_USD_PER_MILLION: ${{ vars.AI_PRICE_OUTPUT_USD_PER_MILLION }}
      RATE_ANONYMOUS_CREATE_PER_IP_HOUR: ${{ vars.RATE_ANONYMOUS_CREATE_PER_IP_HOUR }}
      RATE_ANONYMOUS_CREATE_PER_IP_24H: ${{ vars.RATE_ANONYMOUS_CREATE_PER_IP_24H }}
      RATE_AI_PER_USER_MINUTE: ${{ vars.RATE_AI_PER_USER_MINUTE }}
      RATE_AI_PER_SESSION_MINUTE: ${{ vars.RATE_AI_PER_SESSION_MINUTE }}
      RATE_AI_PER_IP_MINUTE: ${{ vars.RATE_AI_PER_IP_MINUTE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SESSION_TOKEN_PEPPER: ${{ secrets.SESSION_TOKEN_PEPPER }}
      CSRF_TOKEN_PEPPER: ${{ secrets.CSRF_TOKEN_PEPPER }}
      BOOTSTRAP_ID_PEPPER: ${{ secrets.BOOTSTRAP_ID_PEPPER }}
      RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
      CURSOR_SIGNING_SECRET: ${{ secrets.CURSOR_SIGNING_SECRET }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      BETA_ADMISSION_COOKIE_KEY: ${{ secrets.BETA_ADMISSION_COOKIE_KEY }}
    steps:
      - name: Verify commit has successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_runs="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${COMMIT_SHA}&branch=main&status=success&per_page=1" \
              --jq '.total_count'
          )"
          if [[ "${successful_runs}" -lt 1 ]]; then
            echo "::error::No successful CI run found for main commit ${COMMIT_SHA}."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Validate required deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            PUBLIC_ORIGIN BETA_ADMISSION_MODE GOOGLE_WEB_CLIENT_ID TURNSTILE_SITE_KEY
            DB_MAX_OPEN_CONNS DB_MAX_IDLE_CONNS DB_CONN_MAX_LIFETIME_MINUTES
            SESSION_IDLE_DAYS SESSION_ABSOLUTE_DAYS SESSION_ACTIVITY_TOUCH_MINUTES
            ANONYMOUS_BOOTSTRAP_TTL_MINUTES MAX_PROGRESSING_GOALS AI_MODEL AI_MAX_INPUT_TOKENS
            AI_GOAL_REFINE_MAX_OUTPUT_TOKENS AI_ACTION_MAX_OUTPUT_TOKENS AI_MAX_CONTEXT_CYCLES
            AI_TIMEOUT_SECONDS AI_MAX_PROVIDER_ATTEMPTS
            AI_MAX_RETRY_BACKOFF_SECONDS AI_FINALIZATION_GRACE_SECONDS AI_LEASE_SECONDS
            AI_MAX_GENERATIONS_PER_USER_24H AI_GOAL_REFINE_PROMPT_VERSION AI_GENERATE_PROMPT_VERSION
            AI_REFINE_PROMPT_VERSION AI_TOKENIZER_ENCODING AI_MONTHLY_BUDGET_USD
            AI_WARNING_THRESHOLDS AI_PRICE_INPUT_USD_PER_MILLION
            AI_PRICE_OUTPUT_USD_PER_MILLION RATE_ANONYMOUS_CREATE_PER_IP_HOUR
            RATE_ANONYMOUS_CREATE_PER_IP_24H RATE_AI_PER_USER_MINUTE
            RATE_AI_PER_SESSION_MINUTE RATE_AI_PER_IP_MINUTE
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN DATABASE_URL
            MIGRATION_DATABASE_URL OPENAI_API_KEY SESSION_TOKEN_PEPPER
            CSRF_TOKEN_PEPPER BOOTSTRAP_ID_PEPPER RATE_LIMIT_HMAC_SECRET CURSOR_SIGNING_SECRET
            TURNSTILE_SECRET_KEY
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub staging Environment input: ${name}"
              missing=1
            fi
          done
          if [[ "${PUBLIC_ORIGIN}" != "https://cycle.staging.fukamu.matoruru.com" ]]; then
            echo "::error::PUBLIC_ORIGIN must be exactly https://cycle.staging.fukamu.matoruru.com"
            missing=1
          fi
          if [[ -n "${APP_REFERRAL_URL}" && "${APP_REFERRAL_URL}" != "https://cycle.fukamu.com/" ]]; then
            echo "::error::APP_REFERRAL_URL must be empty or exactly https://cycle.fukamu.com/"
            missing=1
          fi
          if [[ "${BETA_ADMISSION_MODE}" != 'off' && "${BETA_ADMISSION_MODE}" != 'closed' ]]; then
            echo '::error::BETA_ADMISSION_MODE must be off or closed.'
            missing=1
          fi
          if [[ "${BETA_ADMISSION_MODE}" == 'closed' ]]; then
            for name in BETA_ADMISSION_COOKIE_TTL_DAYS BETA_INVITES BETA_ADMISSION_COOKIE_KEY; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Closed Beta requires GitHub staging Environment input: ${name}"
                missing=1
              fi
            done
            if ! [[ "${BETA_ADMISSION_COOKIE_TTL_DAYS}" =~ ^[0-9]+$ ]] ||
               (( BETA_ADMISSION_COOKIE_TTL_DAYS < 1 || BETA_ADMISSION_COOKIE_TTL_DAYS > 730 )); then
              echo '::error::BETA_ADMISSION_COOKIE_TTL_DAYS must be an integer from 1 to 730.'
              missing=1
            fi
            if ! jq -e 'type == "array" and length > 0' <<< "${BETA_INVITES}" >/dev/null; then
              echo '::error::BETA_INVITES must be a non-empty JSON array.'
              missing=1
            fi
            if ! [[ "${BETA_ADMISSION_COOKIE_KEY}" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
              echo '::error::BETA_ADMISSION_COOKIE_KEY must be 32 random bytes encoded as base64url.'
              missing=1
            fi
          fi
          exit "${missing}"

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache-dependency-path: backend/go.sum

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static frontend
        env:
          VITE_DEPLOYMENT_ENV: staging
          VITE_APP_REFERRAL_URL: ${{ env.APP_REFERRAL_URL }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ env.GOOGLE_WEB_CLIENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ env.TURNSTILE_SITE_KEY }}
        run: pnpm --filter fukamu-cycle-frontend run build

      - name: Apply database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
          MIGRATIONS_DIR: migrations
        run: go run ./cmd/migrate

      - name: Create ephemeral Worker secrets file
        shell: bash
        env:
          SECRETS_FILE: ${{ runner.temp }}/fukamu-cycle-worker-secrets.json
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const names = [
            "DATABASE_URL", "SESSION_TOKEN_PEPPER", "CSRF_TOKEN_PEPPER", "BOOTSTRAP_ID_PEPPER",
            "RATE_LIMIT_HMAC_SECRET", "CURSOR_SIGNING_SECRET", "OPENAI_API_KEY", "TURNSTILE_SECRET_KEY",
          ];
          if (process.env.BETA_ADMISSION_COOKIE_KEY) names.push("BETA_ADMISSION_COOKIE_KEY");
          const values = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(values), { mode: 0o600 });
          NODE

      - name: Deploy Worker, static assets, and Container
        shell: bash
        run: |
          set -euo pipefail
          variable_names=(
            PUBLIC_ORIGIN BETA_ADMISSION_MODE DB_MAX_OPEN_CONNS DB_MAX_IDLE_CONNS DB_CONN_MAX_LIFETIME_MINUTES
            SESSION_IDLE_DAYS SESSION_ABSOLUTE_DAYS SESSION_ACTIVITY_TOUCH_MINUTES
            ANONYMOUS_BOOTSTRAP_TTL_MINUTES MAX_PROGRESSING_GOALS AI_MODEL AI_MAX_INPUT_TOKENS
            AI_GOAL_REFINE_MAX_OUTPUT_TOKENS AI_ACTION_MAX_OUTPUT_TOKENS AI_MAX_CONTEXT_CYCLES
            AI_TIMEOUT_SECONDS AI_MAX_PROVIDER_ATTEMPTS AI_MAX_RETRY_BACKOFF_SECONDS
            AI_FINALIZATION_GRACE_SECONDS AI_LEASE_SECONDS AI_MAX_GENERATIONS_PER_USER_24H
            AI_GOAL_REFINE_PROMPT_VERSION AI_GENERATE_PROMPT_VERSION AI_REFINE_PROMPT_VERSION
            AI_TOKENIZER_ENCODING AI_MONTHLY_BUDGET_USD AI_WARNING_THRESHOLDS
            AI_PRICE_INPUT_USD_PER_MILLION AI_PRICE_OUTPUT_USD_PER_MILLION GOOGLE_WEB_CLIENT_ID
            RATE_ANONYMOUS_CREATE_PER_IP_HOUR RATE_ANONYMOUS_CREATE_PER_IP_24H
            RATE_AI_PER_USER_MINUTE RATE_AI_PER_SESSION_MINUTE RATE_AI_PER_IP_MINUTE
          )
          variable_args=()
          for name in "${variable_names[@]}"; do
            variable_args+=(--var "${name}:${!name}")
          done
          if [[ "${BETA_ADMISSION_MODE}" == 'closed' ]]; then
            variable_args+=(
              --var "BETA_ADMISSION_COOKIE_TTL_DAYS:${BETA_ADMISSION_COOKIE_TTL_DAYS}"
              --var "BETA_INVITES:${BETA_INVITES}"
            )
          fi
          variable_args+=(--var "AI_PRICING_MODEL:${AI_MODEL}")
          pnpm --filter fukamu-cycle-cloudflare exec wrangler deploy \
            "${variable_args[@]}" \
            --secrets-file "${RUNNER_TEMP}/fukamu-cycle-worker-secrets.json" \
            --containers-rollout=immediate

      - name: Remove ephemeral Worker secrets file
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/fukamu-cycle-worker-secrets.json"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 10 --max-time 30 "${PUBLIC_ORIGIN}/healthz"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 30 "${PUBLIC_ORIGIN}/readyz"
