name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select normal after Terraform Apply, or schema-compatible application recovery
        required: true
        type: choice
        options:
          - normal
          - recovery
      apply_run_id:
        description: Successful exact-current-main Terraform Apply Staging run ID (normal only)
        required: false
        type: string
      recovery_confirmation:
        description: Type RECOVER STAGING APPLICATION WITHOUT TERRAFORM APPLY (recovery only)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Verify deploy dispatch preflight
        shell: bash
        env:
          APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          EXPECTED_APPROVER: ${{ vars.STAGING_DEPLOY_APPROVER }}
          MODE: ${{ inputs.mode }}
          RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != 'workflow_dispatch' ]]; then
            echo '::error::Deploy Staging accepts manual workflow dispatch only.'
            exit 1
          fi
          if [[ "${GITHUB_RUN_ATTEMPT}" != '1' ]]; then
            echo '::error::Deploy Staging workflow reruns are prohibited; start a new manual dispatch after reviewing the prior attempt.'
            exit 1
          fi
          if [[ "${GITHUB_REF}" != 'refs/heads/main' || "${GITHUB_REF_NAME}" != 'main' ]]; then
            echo '::error::Deploy Staging is allowed only from main.'
            exit 1
          fi
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Deploy Staging dispatch commit is not a valid SHA.'
            exit 1
          fi
          if [[ -z "${EXPECTED_APPROVER}" ]]; then
            echo '::error::Missing repository variable STAGING_DEPLOY_APPROVER.'
            exit 1
          fi
          if [[ ! "${EXPECTED_APPROVER}" =~ ^[[:alnum:]]([[:alnum:]-]{0,37}[[:alnum:]])?$ || "${EXPECTED_APPROVER}" =~ -- ]]; then
            echo '::error::Repository variable STAGING_DEPLOY_APPROVER is not a valid GitHub login.'
            exit 1
          fi
          if [[ "${GITHUB_ACTOR,,}" != "${EXPECTED_APPROVER,,}" || "${GITHUB_TRIGGERING_ACTOR,,}" != "${EXPECTED_APPROVER,,}" ]]; then
            echo '::error::Deploy Staging actor and triggering actor must both match STAGING_DEPLOY_APPROVER.'
            exit 1
          fi

          case "${MODE}" in
            normal)
              if [[ ! "${APPLY_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
                echo '::error::Normal deployment requires a numeric Terraform Apply workflow run ID.'
                exit 1
              fi
              if [[ -n "${RECOVERY_CONFIRMATION}" ]]; then
                echo '::error::Normal deployment must not include a recovery confirmation.'
                exit 1
              fi
              ;;
            recovery)
              if [[ -n "${APPLY_RUN_ID}" ]]; then
                echo '::error::Recovery deployment must not include a Terraform Apply workflow run ID.'
                exit 1
              fi
              if [[ "${RECOVERY_CONFIRMATION}" != 'RECOVER STAGING APPLICATION WITHOUT TERRAFORM APPLY' ]]; then
                echo '::error::Recovery deployment requires the exact schema-compatible recovery confirmation.'
                exit 1
              fi
              ;;
            *)
              echo '::error::Deploy Staging mode must be normal or recovery.'
              exit 1
              ;;
          esac

      - name: Resolve approved deployment
        id: resolve
        shell: bash
        env:
          APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          DISPATCH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          main_ref_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          )"
          current_main_sha="$(
            jq -ser \
              '
                if (
                  length == 1 and
                  (.[0] | type) == "object" and
                  .[0].ref == "refs/heads/main" and
                  (.[0].object | type) == "object" and
                  .[0].object.type == "commit" and
                  (.[0].object.sha | type) == "string" and
                  (.[0].object.sha | test("^[0-9a-f]{40}$"))
                ) then
                  .[0].object.sha
                else
                  error("invalid current main ref response")
                end
              ' \
              <<< "${main_ref_json}"
          )"
          if [[ "${DISPATCH_SHA}" != "${current_main_sha}" ]]; then
            echo '::error::Deploy Staging dispatch commit is not current main.'
            exit 1
          fi

          artifact_name=''
          if [[ "${MODE}" == 'normal' ]]; then
            apply_run_json="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${APPLY_RUN_ID}"
            )"
            apply_head_sha="$(
              jq -ser \
                --arg run_id "${APPLY_RUN_ID}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                '
                  if (
                    length == 1 and
                    (.[0] | type) == "object" and
                    (.[0].id | type) == "number" and
                    (.[0].id | floor) == .[0].id and
                    .[0].id > 0 and
                    (.[0].id | tostring) == $run_id and
                    .[0].name == "Terraform Apply Staging" and
                    .[0].path == ".github/workflows/terraform-apply.yml" and
                    .[0].event == "workflow_dispatch" and
                    .[0].status == "completed" and
                    .[0].conclusion == "success" and
                    (.[0].head_sha | type) == "string" and
                    (.[0].head_sha | test("^[0-9a-f]{40}$")) and
                    .[0].head_branch == "main" and
                    (.[0].head_repository | type) == "object" and
                    .[0].head_repository.full_name == $repository
                  ) then
                    .[0].head_sha
                  else
                    error("invalid Terraform Apply workflow run response")
                  end
                ' \
                <<< "${apply_run_json}"
            )"
            if [[ "${apply_head_sha}" != "${current_main_sha}" ]]; then
              echo '::error::Terraform Apply workflow run is not for current main.'
              exit 1
            fi

            artifacts_json="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${APPLY_RUN_ID}/artifacts?per_page=100"
            )"
            artifact_name="$(
              jq -ser \
                --arg run_id "${APPLY_RUN_ID}" \
                --arg expected_name "terraform-apply-staging-${apply_head_sha}" \
                '
                  if (
                    length == 1 and
                    (.[0] | type) == "object" and
                    (.[0].total_count | type) == "number" and
                    (.[0].total_count | floor) == .[0].total_count and
                    .[0].total_count >= 0 and
                    (.[0].artifacts | type) == "array" and
                    .[0].total_count == (.[0].artifacts | length) and
                    .[0].total_count <= 100 and
                    all(.[0].artifacts[];
                      (type == "object") and
                      (.id | type) == "number" and
                      (.id | floor) == .id and
                      .id > 0 and
                      (.name | type) == "string" and
                      (.expired | type) == "boolean" and
                      (.workflow_run | type) == "object" and
                      (.workflow_run.id | type) == "number" and
                      (.workflow_run.id | floor) == .workflow_run.id and
                      (.workflow_run.id | tostring) == $run_id
                    )
                  ) then
                    [
                      .[0].artifacts[]
                      | select(
                          .expired == false and
                          .name == $expected_name
                        )
                    ] as $matches
                    | if ($matches | length) == 1 then
                        $matches[0].name
                      else
                        error("expected exactly one deployment metadata artifact")
                      end
                  else
                    error("invalid or paginated artifact response")
                  end
                ' \
                <<< "${artifacts_json}"
            )"
          fi

          ci_runs_json="$(
            gh api \
              --method GET \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${current_main_sha}" \
              -f branch=main \
              -f event=push \
              -f status=completed \
              -f per_page=100
          )"
          successful_ci_run_id="$(
            jq -ser \
              --arg commit_sha "${current_main_sha}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              '
                if (
                  length == 1 and
                  (.[0] | type) == "object" and
                  (.[0].total_count | type) == "number" and
                  (.[0].total_count | floor) == .[0].total_count and
                  .[0].total_count >= 0 and
                  (.[0].workflow_runs | type) == "array" and
                  .[0].total_count == (.[0].workflow_runs | length) and
                  .[0].total_count <= 100 and
                  all(.[0].workflow_runs[];
                    (type == "object") and
                    (.id | type) == "number" and
                    (.id | floor) == .id and
                    .id > 0 and
                    (.name | type) == "string" and
                    (.path | type) == "string" and
                    (.event | type) == "string" and
                    (.status | type) == "string" and
                    (.conclusion | type) == "string" and
                    (.head_sha | type) == "string" and
                    (.head_branch | type) == "string" and
                    (.head_repository | type) == "object" and
                    (.head_repository.full_name | type) == "string"
                  )
                ) then
                  ([
                    .[0].workflow_runs[]
                    | select(
                        .name == "CI" and
                        .path == ".github/workflows/ci.yml" and
                        .event == "push" and
                        .status == "completed" and
                        .conclusion == "success" and
                        .head_sha == $commit_sha and
                        .head_branch == "main" and
                        .head_repository.full_name == $repository
                      )
                  ]) as $matches
                  | if ($matches | length) >= 1 then
                      ($matches[0].id | tostring)
                    else
                      error("no exact successful main CI run")
                    end
                else
                  error("invalid CI workflow-run response")
                end
              ' \
              <<< "${ci_runs_json}"
          )"
          if [[ ! "${successful_ci_run_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::No exact successful main push CI run found for the deployment commit.'
            exit 1
          fi

          {
            echo "apply_artifact_name=${artifact_name}"
            echo "apply_run_id=${APPLY_RUN_ID}"
            echo "ci_run_id=${successful_ci_run_id}"
            echo "commit_sha=${current_main_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download approved Terraform Apply metadata
        if: inputs.mode == 'normal'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.resolve.outputs.apply_artifact_name }}
          path: ${{ runner.temp }}/fukamu-cycle-terraform-apply-metadata
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve.outputs.apply_run_id }}

      - name: Verify approved Terraform Apply metadata
        if: inputs.mode == 'normal'
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/fukamu-cycle-terraform-apply-metadata
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! -d "${ARTIFACT_DIRECTORY}" || -L "${ARTIFACT_DIRECTORY}" ]]; then
            echo '::error::Terraform Apply metadata artifact directory is invalid.'
            exit 1
          fi
          entry_count="$(find -P "${ARTIFACT_DIRECTORY}" -mindepth 1 -maxdepth 1 -printf '.' | wc -c)"
          metadata_file="${ARTIFACT_DIRECTORY}/commit-sha"
          if [[ "${entry_count}" != '1' || ! -f "${metadata_file}" || -L "${metadata_file}" ]]; then
            echo '::error::Terraform Apply metadata artifact must contain only one regular commit-sha file.'
            exit 1
          fi
          if [[ "$(wc -c < "${metadata_file}")" != '41' ]]; then
            echo '::error::Terraform Apply metadata commit-sha has an invalid size.'
            exit 1
          fi
          artifact_commit="$(tr -d '\n' < "${metadata_file}")"
          if [[ ! "${artifact_commit}" =~ ^[0-9a-f]{40}$ || "${artifact_commit}" != "${COMMIT_SHA}" ]]; then
            echo '::error::Terraform Apply metadata commit does not match current main.'
            exit 1
          fi

      - name: Re-verify deployment commit before Staging approval
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_ref_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          )"
          current_main_sha="$(
            jq -ser \
              '
                if (
                  length == 1 and
                  (.[0] | type) == "object" and
                  .[0].ref == "refs/heads/main" and
                  (.[0].object | type) == "object" and
                  .[0].object.type == "commit" and
                  (.[0].object.sha | type) == "string" and
                  (.[0].object.sha | test("^[0-9a-f]{40}$"))
                ) then
                  .[0].object.sha
                else
                  error("invalid current main ref response")
                end
              ' \
              <<< "${main_ref_json}"
          )"
          if [[ "${COMMIT_SHA}" != "${current_main_sha}" ]]; then
            echo '::error::Deployment commit became stale before Staging approval.'
            exit 1
          fi

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: https://cycle.staging.fukamu.matoruru.com
    env:
      COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      BETA_ADMISSION_MODE: ${{ vars.BETA_ADMISSION_MODE || 'off' }}
      BETA_ADMISSION_COOKIE_TTL_DAYS: ${{ vars.BETA_ADMISSION_COOKIE_TTL_DAYS }}
      BETA_INVITES: ${{ vars.BETA_INVITES }}
      APP_REFERRAL_URL: ${{ vars.APP_REFERRAL_URL }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      DB_MAX_OPEN_CONNS: ${{ vars.DB_MAX_OPEN_CONNS }}
      DB_MAX_IDLE_CONNS: ${{ vars.DB_MAX_IDLE_CONNS }}
      DB_CONN_MAX_LIFETIME_MINUTES: ${{ vars.DB_CONN_MAX_LIFETIME_MINUTES }}
      SESSION_IDLE_DAYS: ${{ vars.SESSION_IDLE_DAYS }}
      SESSION_ABSOLUTE_DAYS: ${{ vars.SESSION_ABSOLUTE_DAYS }}
      SESSION_ACTIVITY_TOUCH_MINUTES: ${{ vars.SESSION_ACTIVITY_TOUCH_MINUTES }}
      ANONYMOUS_BOOTSTRAP_TTL_MINUTES: ${{ vars.ANONYMOUS_BOOTSTRAP_TTL_MINUTES }}
      MAX_PROGRESSING_GOALS: ${{ vars.MAX_PROGRESSING_GOALS }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT }}
      AI_MAX_INPUT_TOKENS: ${{ vars.AI_MAX_INPUT_TOKENS }}
      AI_GOAL_REFINE_MAX_OUTPUT_TOKENS: ${{ vars.AI_GOAL_REFINE_MAX_OUTPUT_TOKENS }}
      AI_ACTION_MAX_OUTPUT_TOKENS: ${{ vars.AI_ACTION_MAX_OUTPUT_TOKENS }}
      AI_MAX_CONTEXT_CYCLES: ${{ vars.AI_MAX_CONTEXT_CYCLES }}
      AI_TIMEOUT_SECONDS: ${{ vars.AI_TIMEOUT_SECONDS }}
      AI_MAX_PROVIDER_ATTEMPTS: ${{ vars.AI_MAX_PROVIDER_ATTEMPTS }}
      AI_MAX_RETRY_BACKOFF_SECONDS: ${{ vars.AI_MAX_RETRY_BACKOFF_SECONDS }}
      AI_FINALIZATION_GRACE_SECONDS: ${{ vars.AI_FINALIZATION_GRACE_SECONDS }}
      AI_LEASE_SECONDS: ${{ vars.AI_LEASE_SECONDS }}
      AI_MAX_GENERATIONS_PER_USER_24H: ${{ vars.AI_MAX_GENERATIONS_PER_USER_24H }}
      AI_GOAL_REFINE_PROMPT_VERSION: ${{ vars.AI_GOAL_REFINE_PROMPT_VERSION }}
      AI_GENERATE_PROMPT_VERSION: ${{ vars.AI_GENERATE_PROMPT_VERSION }}
      AI_REFINE_PROMPT_VERSION: ${{ vars.AI_REFINE_PROMPT_VERSION }}
      AI_TOKENIZER_ENCODING: ${{ vars.AI_TOKENIZER_ENCODING }}
      AI_MONTHLY_BUDGET_USD: ${{ vars.AI_MONTHLY_BUDGET_USD }}
      AI_WARNING_THRESHOLDS: ${{ vars.AI_WARNING_THRESHOLDS }}
      AI_PRICE_INPUT_USD_PER_MILLION: ${{ vars.AI_PRICE_INPUT_USD_PER_MILLION }}
      AI_PRICE_OUTPUT_USD_PER_MILLION: ${{ vars.AI_PRICE_OUTPUT_USD_PER_MILLION }}
      RATE_ANONYMOUS_CREATE_PER_IP_HOUR: ${{ vars.RATE_ANONYMOUS_CREATE_PER_IP_HOUR }}
      RATE_ANONYMOUS_CREATE_PER_IP_24H: ${{ vars.RATE_ANONYMOUS_CREATE_PER_IP_24H }}
      RATE_GOAL_START_PER_USER_MINUTE: ${{ vars.RATE_GOAL_START_PER_USER_MINUTE }}
      RATE_GOAL_START_PER_SESSION_MINUTE: ${{ vars.RATE_GOAL_START_PER_SESSION_MINUTE }}
      RATE_AI_PER_USER_MINUTE: ${{ vars.RATE_AI_PER_USER_MINUTE }}
      RATE_AI_PER_SESSION_MINUTE: ${{ vars.RATE_AI_PER_SESSION_MINUTE }}
      RATE_AI_PER_IP_MINUTE: ${{ vars.RATE_AI_PER_IP_MINUTE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache-dependency-path: backend/go.sum

      - name: Validate required deployment inputs
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          SESSION_TOKEN_PEPPER: ${{ secrets.SESSION_TOKEN_PEPPER }}
          CSRF_TOKEN_PEPPER: ${{ secrets.CSRF_TOKEN_PEPPER }}
          BOOTSTRAP_ID_PEPPER: ${{ secrets.BOOTSTRAP_ID_PEPPER }}
          RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
          CURSOR_SIGNING_SECRET: ${{ secrets.CURSOR_SIGNING_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          BETA_ADMISSION_COOKIE_KEY: ${{ secrets.BETA_ADMISSION_COOKIE_KEY }}
        run: node ./scripts/validate-deploy-inputs.mjs

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dependency install preserved candidate tree
        run: |
          set -euo pipefail
          git diff --quiet --
          git diff --cached --quiet --
          untracked_files="$(git ls-files --others --exclude-standard)"
          [[ -z "${untracked_files}" ]]

      - name: Install staging Chromium
        run: pnpm --filter fukamu-cycle-frontend --fail-if-no-match exec playwright install --with-deps chromium

      - name: Build static frontend
        env:
          VITE_DEPLOYMENT_ENV: staging
          VITE_APP_REFERRAL_URL: ${{ env.APP_REFERRAL_URL }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ env.GOOGLE_WEB_CLIENT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ env.TURNSTILE_SITE_KEY }}
        run: pnpm --filter fukamu-cycle-frontend --fail-if-no-match run build

      - name: Validate Backend runtime configuration
        shell: bash
        working-directory: backend
        env:
          APP_ENV: production
          HTTP_ADDRESS: :8080
          STATIC_DIR: ""
          AI_PROVIDER: openai
          AI_PRICING_MODEL: ${{ env.AI_MODEL }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          SESSION_TOKEN_PEPPER: ${{ secrets.SESSION_TOKEN_PEPPER }}
          CSRF_TOKEN_PEPPER: ${{ secrets.CSRF_TOKEN_PEPPER }}
          BOOTSTRAP_ID_PEPPER: ${{ secrets.BOOTSTRAP_ID_PEPPER }}
          RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
          CURSOR_SIGNING_SECRET: ${{ secrets.CURSOR_SIGNING_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_ENABLED: "true"
          TURNSTILE_EXPECTED_ACTION: anonymous_bootstrap
        run: GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly go run ./cmd/configcheck

      - name: Verify current Staging health and readiness before migration
        shell: bash
        env:
          STAGING_BASE_URL: ${{ env.PUBLIC_ORIGIN }}
          STAGING_CRITICAL_MODE: preflight
        run: bash ./scripts/check-staging-critical.sh

      - name: Run stable CSRF initial rollout and authoritative drain
        shell: bash
        env:
          DEPLOY_MODE: ${{ inputs.mode }}
          APPLY_RUN_ID: ${{ inputs.apply_run_id }}
          EXACT_MAIN_CI_RUN_ID: ${{ needs.resolve.outputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          STAGING_BASE_URL: ${{ env.PUBLIC_ORIGIN }}
          STAGING_ADMISSION_MODE: auto
          STAGING_E2E_INVITE_TOKEN: ${{ secrets.STAGING_E2E_INVITE_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          SESSION_TOKEN_PEPPER: ${{ secrets.SESSION_TOKEN_PEPPER }}
          CSRF_TOKEN_PEPPER: ${{ secrets.CSRF_TOKEN_PEPPER }}
          BOOTSTRAP_ID_PEPPER: ${{ secrets.BOOTSTRAP_ID_PEPPER }}
          RATE_LIMIT_HMAC_SECRET: ${{ secrets.RATE_LIMIT_HMAC_SECRET }}
          CURSOR_SIGNING_SECRET: ${{ secrets.CURSOR_SIGNING_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BETA_ADMISSION_COOKIE_KEY: ${{ secrets.BETA_ADMISSION_COOKIE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bash ./scripts/check-staging-csrf-rollout.sh
          STAGING_ROLLOUT_EVIDENCE_STAGE=smoke_passed \
            STAGING_ROLLOUT_PENDING_EVIDENCE_FILE="${RUNNER_TEMP}/fukamu-cycle-stable-csrf-rollout-drained.json" \
            STAGING_ROLLOUT_EVIDENCE_FILE="${RUNNER_TEMP}/fukamu-cycle-stable-csrf-rollout-smoke-passed.json" \
            node ./scripts/write-staging-rollout-evidence.mjs
          {
            echo '### Stable CSRF live smoke result'
            echo
            echo "- Exact-main CI commit: \`${COMMIT_SHA}\`"
            echo '- Legacy-to-stable two-tab/security smoke: passed'
            echo '- Public account cleanup and revoked-session check: passed'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload stable CSRF rollout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-csrf-rollout-${{ env.COMMIT_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fukamu-cycle-stable-csrf-rollout-drained.json
            ${{ runner.temp }}/fukamu-cycle-stable-csrf-rollout-smoke-passed.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 10 --max-time 30 "${PUBLIC_ORIGIN}/healthz"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 30 "${PUBLIC_ORIGIN}/readyz"

      - name: Run post-deploy staging critical journey
        shell: bash
        env:
          STAGING_BASE_URL: ${{ env.PUBLIC_ORIGIN }}
          STAGING_CRITICAL_MODE: full
          STAGING_ADMISSION_MODE: ${{ env.BETA_ADMISSION_MODE }}
          STAGING_E2E_INVITE_TOKEN: ${{ secrets.STAGING_E2E_INVITE_TOKEN }}
        run: bash ./scripts/check-staging-critical.sh
