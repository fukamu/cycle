name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pdcai
          POSTGRES_PASSWORD: pdcai
          POSTGRES_DB: pdcai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdcai -d pdcai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pdcai:pdcai@localhost:5432/pdcai_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - run: sqlc compile
      - run: sqlc generate
      - run: git diff --exit-code
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/server
      - run: go build ./cmd/migrate

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --file compose.local.yaml config --quiet
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive .
        working-directory: infra/terraform/staging
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/staging
      - run: terraform validate
        working-directory: infra/terraform/staging
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm ci
        working-directory: cloudflare
      - run: npm run check
        working-directory: cloudflare
      - run: npm run deploy:dry-run
        working-directory: cloudflare

  e2e:
    needs: [workflow, frontend, backend, infrastructure]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pdcai
          POSTGRES_PASSWORD: pdcai
          POSTGRES_DB: pdcai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdcai -d pdcai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          TEST_DATABASE_URL: postgres://pdcai:pdcai@127.0.0.1:5432/pdcai_test?sslmode=disable
