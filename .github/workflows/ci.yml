name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  reuse_pr_ci:
    name: Reuse verified PR CI
    runs-on: ubuntu-latest
    outputs:
      reuse_pr_ci: ${{ steps.resolve.outputs.reuse_pr_ci }}
      source_pr_number: ${{ steps.resolve.outputs.source_pr_number }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      tested_tree: ${{ steps.resolve.outputs.tested_tree }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve reusable PR CI attestation
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-ci-reuse.sh "${GITHUB_SHA}" "${GITHUB_REPOSITORY}" "${GITHUB_OUTPUT}"
      - name: Publish reuse decision
        shell: bash
        env:
          REUSE_PR_CI: ${{ steps.resolve.outputs.reuse_pr_ci }}
          SOURCE_PR_NUMBER: ${{ steps.resolve.outputs.source_pr_number }}
          SOURCE_RUN_ID: ${{ steps.resolve.outputs.source_run_id }}
          TESTED_TREE: ${{ steps.resolve.outputs.tested_tree }}
        run: |
          if [[ "${REUSE_PR_CI}" == "true" ]]; then
            {
              echo '## Reused verified pull request CI'
              echo
              echo "- Pull request: #${SOURCE_PR_NUMBER}"
              echo "- CI run: ${SOURCE_RUN_ID}"
              echo "- Exact tested tree: \`${TESTED_TREE}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'PR CI could not be safely reused; the full CI suite will run.' >> "${GITHUB_STEP_SUMMARY}"
          fi

  workflow:
    needs: reuse_pr_ci
    if: needs.reuse_pr_ci.outputs.reuse_pr_ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test CI reuse resolver
        run: bash .github/scripts/resolve-ci-reuse.test.sh
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Validate Bash scripts
        run: bash ./scripts/check-shell.sh

  frontend:
    needs: reuse_pr_ci
    if: needs.reuse_pr_ci.outputs.reuse_pr_ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pdcai-frontend run format:check
      - run: pnpm --filter pdcai-frontend run lint
      - run: pnpm --filter pdcai-frontend run typecheck
      - run: pnpm --filter pdcai-frontend test
      - run: pnpm --filter pdcai-frontend run build

  backend:
    needs: reuse_pr_ci
    if: needs.reuse_pr_ci.outputs.reuse_pr_ci != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: pdcai
          POSTGRES_PASSWORD: pdcai
          POSTGRES_DB: pdcai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdcai -d pdcai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pdcai:pdcai@localhost:5432/pdcai_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - run: sqlc compile
      - run: sqlc generate
      - run: git diff --exit-code
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/server
      - run: go build ./cmd/migrate

  infrastructure:
    needs: reuse_pr_ci
    if: needs.reuse_pr_ci.outputs.reuse_pr_ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: docker compose --file compose.local.yaml config --quiet
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive .
        working-directory: infra/terraform/staging
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/staging
      - run: terraform validate
        working-directory: infra/terraform/staging
      - run: pnpm --filter pdcai-frontend run build
      - run: pnpm --filter pdcai-cloudflare run check
      - run: pnpm --filter pdcai-cloudflare run deploy:dry-run

  e2e:
    needs: [reuse_pr_ci, workflow, frontend, backend, infrastructure]
    if: >-
      always() &&
      needs.reuse_pr_ci.outputs.reuse_pr_ci != 'true' &&
      needs.workflow.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.infrastructure.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: pdcai
          POSTGRES_PASSWORD: pdcai
          POSTGRES_DB: pdcai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdcai -d pdcai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: backend/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pdcai-frontend exec playwright install --with-deps chromium
      - run: pnpm --filter pdcai-frontend run build
      - run: pnpm --filter pdcai-frontend run test:e2e
        env:
          TEST_DATABASE_URL: postgres://pdcai:pdcai@127.0.0.1:5432/pdcai_test?sslmode=disable

  attest_pr_ci:
    name: Attest tested PR tree
    needs: [reuse_pr_ci, workflow, frontend, backend, infrastructure, e2e]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.reuse_pr_ci.result == 'success' &&
      needs.workflow.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.infrastructure.result == 'success' &&
      needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Write tested tree attestation
        id: metadata
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          tested_tree="$(git rev-parse 'HEAD^{tree}')"
          artifact_name="pr-ci-${PR_NUMBER}-${HEAD_SHA}-${tested_tree}"
          mkdir -p "${RUNNER_TEMP}/pdcai-pr-ci-attestation"
          {
            echo "pull_request=${PR_NUMBER}"
            echo "head_sha=${HEAD_SHA}"
            echo "tested_commit=${GITHUB_SHA}"
            echo "tested_tree=${tested_tree}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > "${RUNNER_TEMP}/pdcai-pr-ci-attestation/attestation.txt"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
      - name: Upload tested tree attestation
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/pdcai-pr-ci-attestation/attestation.txt
          if-no-files-found: error
          retention-days: 30
