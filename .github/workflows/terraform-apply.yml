name: Terraform Apply Staging

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful Terraform Plan Staging workflow run ID to approve
        required: true
        type: string
      credential_inventory_confirmation:
        description: Type CONFIRM APPLY R2 INVENTORY NO FALLBACK after value-free credential inventory checks
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: staging-terraform
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      plan_run_id: ${{ steps.resolve.outputs.plan_run_id }}
    steps:
      - name: Verify Terraform credential inventory confirmation
        shell: bash
        env:
          CREDENTIAL_INVENTORY_CONFIRMATION: ${{ inputs.credential_inventory_confirmation }}
        run: |
          set -euo pipefail
          if [[ "${CREDENTIAL_INVENTORY_CONFIRMATION}" != 'CONFIRM APPLY R2 INVENTORY NO FALLBACK' ]]; then
            echo '::error::Complete the value-free Terraform credential inventory checks and enter the exact confirmation.'
            exit 1
          fi

      - name: Verify approver and resolve saved plan
        id: resolve
        shell: bash
        env:
          EXPECTED_APPROVER: ${{ vars.TERRAFORM_APPLY_APPROVER }}
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo '::error::Terraform Apply is allowed only from main.'
            exit 1
          fi
          if [[ -z "${EXPECTED_APPROVER}" ]]; then
            echo '::error::Missing repository variable TERRAFORM_APPLY_APPROVER.'
            exit 1
          fi
          if [[ "${GITHUB_ACTOR,,}" != "${EXPECTED_APPROVER,,}" || "${GITHUB_TRIGGERING_ACTOR,,}" != "${EXPECTED_APPROVER,,}" ]]; then
            echo '::error::Terraform Apply actor and triggering actor must both match TERRAFORM_APPLY_APPROVER.'
            exit 1
          fi
          if [[ ! "${PLAN_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Plan workflow run ID must be numeric: ${PLAN_RUN_ID}"
            exit 1
          fi

          plan_run_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}"
          )"
          plan_head_sha="$(
            jq -ser \
              --arg run_id "${PLAN_RUN_ID}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              '
                if (
                  length == 1 and
                  (.[0] | type) == "object" and
                  (.[0].id | type) == "number" and
                  (.[0].id | floor) == .[0].id and
                  .[0].id > 0 and
                  (.[0].id | tostring) == $run_id and
                  (.[0].name | type) == "string" and
                  .[0].name == "Terraform Plan Staging" and
                  (.[0].path | type) == "string" and
                  .[0].path == ".github/workflows/terraform-plan.yml" and
                  (.[0].event | type) == "string" and
                  (.[0].event == "workflow_run" or
                   .[0].event == "workflow_dispatch") and
                  (.[0].status | type) == "string" and
                  .[0].status == "completed" and
                  (.[0].conclusion | type) == "string" and
                  .[0].conclusion == "success" and
                  (.[0].head_sha | type) == "string" and
                  (.[0].head_sha | test("^[0-9a-f]{40}$")) and
                  (.[0].head_branch | type) == "string" and
                  .[0].head_branch == "main" and
                  (.[0].head_repository | type) == "object" and
                  (.[0].head_repository.full_name | type) == "string" and
                  .[0].head_repository.full_name == $repository
                ) then
                  .[0].head_sha
                else
                  error("invalid Terraform Plan workflow run response")
                end
              ' \
              <<< "${plan_run_json}"
          )"

          artifacts_json="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}/artifacts?per_page=100"
          )"
          artifact_record="$(
            jq -ser \
              --arg run_id "${PLAN_RUN_ID}" \
              --arg expected_name "terraform-plan-staging-${plan_head_sha}-changes_present" \
              '
                if (
                  length == 1 and
                  (.[0] | type) == "object" and
                  (.[0].total_count | type) == "number" and
                  (.[0].total_count | floor) == .[0].total_count and
                    .[0].total_count == 1 and
                    (.[0].artifacts | type) == "array" and
                  .[0].total_count == (.[0].artifacts | length) and
                  .[0].total_count <= 100 and
                  all(.[0].artifacts[];
                    (type == "object") and
                    (.id | type) == "number" and
                    (.id | floor) == .id and
                    .id > 0 and
                    (.name | type) == "string" and
                    (.expired | type) == "boolean" and
                    (.workflow_run | type) == "object" and
                    (.workflow_run.id | type) == "number" and
                    (.workflow_run.id | floor) == .workflow_run.id and
                    (.workflow_run.id | tostring) == $run_id
                  )
                ) then
                  [
                    .[0].artifacts[]
                    | select(
                        .expired == false and
                        .name == $expected_name
                      )
                  ] as $matches
                  | if ($matches | length) == 1 then
                      [($matches[0].id | tostring), $matches[0].name] | @tsv
                    else
                      error("expected exactly one changes-present Terraform plan artifact")
                    end
                else
                  error("invalid or paginated artifact response")
                end
              ' \
              <<< "${artifacts_json}"
          )"
          IFS=$'\t' read -r artifact_id artifact_name unexpected <<< "${artifact_record}"
          if [[ ! "${artifact_id}" =~ ^[1-9][0-9]*$ || -n "${unexpected:-}" || "${artifact_name}" != "terraform-plan-staging-${plan_head_sha}-changes_present" ]]; then
            echo '::error::Terraform Plan artifact resolution was invalid.'
            exit 1
          fi
          commit_sha="${plan_head_sha}"
          current_main_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ "${commit_sha}" != "${current_main_sha}" ]]; then
            echo "::error::Plan commit ${commit_sha} is stale; current main is ${current_main_sha}."
            exit 1
          fi

          {
            echo "artifact_id=${artifact_id}"
            echo "artifact_name=${artifact_name}"
            echo "commit_sha=${commit_sha}"
            echo "plan_run_id=${PLAN_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"

  apply:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging-terraform-apply
      url: https://cycle.staging.fukamu.matoruru.com
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_APPLY_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_APPLY_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.TERRAFORM_CLOUDFLARE_API_TOKEN }}
      COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
      PLAN_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
      PLAN_ARTIFACT_NAME: ${{ needs.preflight.outputs.artifact_name }}
      PLAN_RUN_ID: ${{ needs.preflight.outputs.plan_run_id }}
      R2_STATE_BUCKET: ${{ vars.TERRAFORM_R2_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_cloudflare_account_id: ${{ vars.TERRAFORM_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Terraform deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFLARE_API_TOKEN
            R2_STATE_BUCKET TF_VAR_cloudflare_account_id
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Terraform Apply input: ${name}"
              missing=1
            fi
          done
          if [[ ! "${TF_VAR_cloudflare_account_id}" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::TERRAFORM_CLOUDFLARE_ACCOUNT_ID must be 32 lowercase hexadecimal characters."
            missing=1
          fi
          if [[ ! "${R2_STATE_BUCKET}" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::TERRAFORM_R2_STATE_BUCKET must be a 3-63 character R2 bucket name."
            missing=1
          fi
          exit "${missing}"

      - name: Verify approved plan is still main HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ "${COMMIT_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Approved plan commit ${COMMIT_SHA} is stale; current main is ${current_main_sha}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          install: false

      - name: Download approved saved plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PLAN_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/fukamu-cycle-terraform-plan
          github-token: ${{ github.token }}
          run-id: ${{ env.PLAN_RUN_ID }}

      - name: Verify saved plan integrity and commit
        id: verify_plan
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ env.COMMIT_SHA }}
          EXPECTED_PLAN_RESULT: changes_present
          EXPECTED_WORKFLOW_RUN_ID: ${{ env.PLAN_RUN_ID }}
          TERRAFORM_EVIDENCE_DIRECTORY: ${{ runner.temp }}/fukamu-cycle-terraform-plan
          TERRAFORM_EVIDENCE_OPERATION: verify_plan
        run: |
          set -euo pipefail
          plan_sha256="$(node ./scripts/terraform-evidence.mjs)"
          echo "plan_sha256=${plan_sha256}" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Prepare ephemeral R2 backend configuration
        shell: bash
        env:
          BACKEND_CONFIG: ${{ runner.temp }}/fukamu-cycle-staging-backend.hcl
        run: |
          set -euo pipefail
          cp infra/terraform/staging/backend.hcl.example "${BACKEND_CONFIG}"
          sed -i \
            -e "s/<R2_STATE_BUCKET_NAME>/${R2_STATE_BUCKET}/g" \
            -e "s/<CLOUDFLARE_ACCOUNT_ID>/${TF_VAR_cloudflare_account_id}/g" \
            "${BACKEND_CONFIG}"

      - name: Initialize Terraform
        working-directory: infra/terraform/staging
        run: terraform init -input=false -backend-config="${RUNNER_TEMP}/fukamu-cycle-staging-backend.hcl"

      - name: Re-verify approved plan is still main HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha'
          )"
          if [[ ! "${current_main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Current main ref did not resolve to a valid commit SHA: ${current_main_sha}"
            exit 1
          fi
          if [[ "${COMMIT_SHA}" != "${current_main_sha}" ]]; then
            echo "::error::Approved plan commit ${COMMIT_SHA} became stale before apply; current main is ${current_main_sha}."
            exit 1
          fi

      - name: Back up and drill Terraform state
        id: state_recovery
        shell: bash
        run: bash ./scripts/backup-and-drill-terraform-state.sh

      - name: Apply approved saved plan
        working-directory: infra/terraform/staging
        run: terraform apply -input=false -no-color "${RUNNER_TEMP}/fukamu-cycle-terraform-plan/staging.tfplan"

      - name: Publish apply result
        working-directory: infra/terraform/staging
        shell: bash
        run: |
          set -euo pipefail
          sitekey="$(terraform output -raw turnstile_sitekey)"
          {
            echo '## Terraform Apply completed'
            echo
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Turnstile site key (public): \`${sitekey}\`"
            echo "- State backup: \`${{ steps.state_recovery.outputs.state_backup_key }}\`"
            echo "- State backup checksum: \`${{ steps.state_recovery.outputs.state_backup_checksum_key }}\`"
            echo "- Applied Plan checksum: \`${{ steps.verify_plan.outputs.plan_sha256 }}\`"
            echo "- Manually run \`Deploy Staging\` in \`normal\` mode with infrastructure evidence run ID \`${GITHUB_RUN_ID}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write deployment metadata
        shell: bash
        env:
          PLAN_RUN_ID: ${{ env.PLAN_RUN_ID }}
          TERRAFORM_APPLY_EVIDENCE_FILE: ${{ runner.temp }}/fukamu-cycle-terraform-apply/terraform-apply-evidence.json
          TERRAFORM_EVIDENCE_OPERATION: write_apply
          TERRAFORM_PLAN_EVIDENCE_FILE: ${{ runner.temp }}/fukamu-cycle-terraform-plan/terraform-plan-evidence.json
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/fukamu-cycle-terraform-apply"
          node ./scripts/terraform-evidence.mjs

      - name: Upload deployment metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-apply-staging-${{ env.COMMIT_SHA }}
          path: ${{ runner.temp }}/fukamu-cycle-terraform-apply/terraform-apply-evidence.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Delete applied plan artifact
        if: success()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PLAN_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          gh api \
            --method DELETE \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PLAN_ARTIFACT_ID}"
