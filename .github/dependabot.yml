version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    groups:
      github-actions-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
    open-pull-requests-limit: 1
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    groups:
      docker-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
    open-pull-requests-limit: 1
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "05:00"
      timezone: "Asia/Tokyo"
    groups:
      docker-compose-version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
    open-pull-requests-limit: 1
