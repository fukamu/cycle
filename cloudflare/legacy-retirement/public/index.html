<!doctype html>
<html lang="ja" data-legacy-retirement="v2">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>旧PDCAIサイトは終了しました</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/retire.mjs"></script>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="retirement-title">
        <p class="eyebrow">FUKAMU Cycle</p>
        <h1 id="retirement-title">旧PDCAIサイトは終了しました</h1>
        <p>
          サービスは新しいFUKAMU
          Cycleへ移行しました。旧サイトから未保存の入力内容を新しいサイトへ移行・送信することはありません。
        </p>
        <div
          class="status"
          data-retirement-status
          role="status"
          aria-live="polite"
        >
          このブラウザに残る旧サイトのデータを安全に確認しています…
        </div>
        <p class="detail">
          有効な未保存入力は最終更新から24時間だけ保持し、期限後の次回アクセス時に削除します。削除処理はこのブラウザ内だけで行われます。
        </p>
        <button type="button" data-retirement-retry hidden>もう一度試す</button>
        <a
          class="primary-link"
          href="https://cycle.staging.fukamu.matoruru.com/"
          rel="noreferrer"
        >
          FUKAMU Cycleを開く
        </a>
      </section>
    </main>
  </body>
</html>
